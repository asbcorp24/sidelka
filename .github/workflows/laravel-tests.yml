name: Laravel tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: sidelka_test
          MYSQL_USER: sidelka
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, mysql, gd
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          APP_ENV: testing

      - name: Run migrations
        run: php artisan migrate --force
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: sidelka_test
          DB_USERNAME: sidelka
          DB_PASSWORD: secret

      - name: Run tests
        run: php artisan test
        env:
          APP_ENV: testing
          APP_DEBUG: true
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: sidelka_test
          DB_USERNAME: sidelka
          DB_PASSWORD: secret
          CACHE_DRIVER: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
          LEGAL_COMPANY_NAME: ООО Тестовая площадка
          LEGAL_COMPANY_INN: '1650000000'
          LEGAL_COMPANY_OGRN: '1161600000000'
          LEGAL_COMPANY_ADDRESS: г. Казань, ул. Тестовая, 1
          LEGAL_COMPANY_SIGNATORY_NAME: Иванов Иван Иванович
